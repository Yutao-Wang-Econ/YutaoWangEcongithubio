works:

- title: "Social Institutions and Low Birth Rates"
  pdflink: "https://yutao-wang-econ.github.io/files/JMP_YutaoWANG.pdf"
  coauthors: "[Christine Ho](https://sites.google.com/site/christineho5)"
  book: "<em>Job Market Paper</em>, 2026"
  note: "Current Version: Feb 2026"
  abstract: >
    We document three cross-sectional stylized facts on labor supply and family formation. First, female labor force participation (FLFP) and total fertility rates (TFRs) are much lower in East Asia compared to Western economies. Second, labor hours and the gender pay gap are much higher in the East than in the West. Third, parents invest more in children’s edu cation in East Asia compared to Western economies. We show these patterns emerge from interactions among three institutions: child quality mores, gender norms, and long work hours. Using a heterogeneous-agent model with endogenous marriage, fertility, and labor supply estimated on South Korea and the United States, we demonstrate single-institution reforms face inherent trade-offs: reducing child quality emphasis raises FLFP but lowers fertility, while reducing gender barriers has opposite effects. Multi-pronged policies targeting multiple institutions, or gender wage gap reductions affecting multiple channels, boost both outcomes.

- title: "Family Size and Child Migration: Do Girls Face Greater Trade-Offs than Boys?"
  pdflink: "https://yutao-wang-econ.github.io/files/Ho,%20Wang,%20and%20Zuo%20(2024)%20Family%20Size%20and%20Child%20Migration.pdf"
  coauthors: "[Christine Ho](https://sites.google.com/site/christineho5) and [Sharon Xuejing Zuo](https://sites.google.com/site/sharonxuejingzuo/home)"
  book: "Revise & Resubmit"
  note: "Current Version: Jan 2026"
  abstract: >
    Migrating with all family members is desirable but not always feasible in developing countries characterized with massive internal migration and significant rural-urban inequality. This study examines the causal impact of family size on children's rural-to-urban migration in China. Using a twin-based instrumental variable strategy, we first find that larger migrating families are more likely to leave children in the rural areas. More importantly, an additional sibling reduces the probability of a girl migrating by 12.9 percentage points, with a negligible effect on boys. The gender-differential effects are driven by a combination of son-biased fertility preferences and the diseconomies of scale in migration cost, rather than conventional son-biased allocative preferences.

